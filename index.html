<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>硒鼓安装教程视频库</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 15px;
            font-size: 24px;
        }
        h1 .icon {
            font-size: 28px;
            margin-right: 10px;
            vertical-align: middle;
        }
        .search-box {
            width: 100%;
            padding: 15px;
            font-size: 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            margin-bottom: 15px;
            transition: all 0.3s;
        }
        .search-box:focus {
            border-color: #667eea;
            outline: none;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        .instructions {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            border-left: 4px solid #667eea;
        }
        .instructions h3 {
            color: #333;
            margin-bottom: 10px;
            font-size: 16px;
        }
        .instructions ol {
            padding-left: 20px;
            margin: 0;
        }
        .instructions li {
            margin-bottom: 8px;
            color: #666;
            line-height: 1.5;
        }
        .instructions li:last-child {
            margin-bottom: 0;
        }
        .video-list {
            display: grid;
            gap: 20px;
        }
        .video-item {
            background: white;
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #e8e8e8;
            box-shadow: 0 3px 10px rgba(0,0,0,0.05);
            transition: all 0.3s;
        }
        .video-item:hover {
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transform: translateY(-2px);
        }
        .video-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .video-title {
            font-weight: bold;
            color: #333;
            font-size: 18px;
            flex: 1;
        }
        .play-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.3s;
            white-space: nowrap;
            margin-left: 15px;
        }
        .play-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        .play-btn.playing {
            background: linear-gradient(135deg, #f56565 0%, #ed8936 100%);
        }
        .video-container {
            width: 100%;
            height: 0;
            overflow: hidden;
            transition: height 0.4s ease;
            border-radius: 8px;
            margin-top: 15px;
            background: #000;
        }
        .video-container.active {
            height: 340px;
        }
        .video-player {
            width: 100%;
            height: 340px;
            border-radius: 8px;
            border: none;
            display: block;
        }
        .no-result {
            text-align: center;
            color: #999;
            padding: 40px;
            font-size: 16px;
        }
        .loading {
            text-align: center;
            color: #666;
            padding: 20px;
            font-size: 14px;
        }
        .video-count {
            text-align: center;
            color: #667eea;
            font-weight: bold;
            margin-top: 10px;
            font-size: 14px;
        }
        @media (max-width: 768px) {
            body { padding: 10px; }
            .container { padding: 15px; }
            .video-header { flex-direction: column; align-items: flex-start; }
            .video-title { margin-bottom: 10px; }
            .play-btn { margin-left: 0; align-self: flex-end; }
            .video-container.active { height: 200px; }
            .video-player { height: 200px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>
            <span class="icon">💻</span>硒鼓安装教程视频库
        </h1>
        
        <div class="video-count">共 50 个安装教程视频</div>
        
        <input type="text" class="search-box" placeholder="请输入硒鼓型号或产品名称搜索..." id="searchInput">
        
        <div class="instructions">
            <h3>📚 使用说明：</h3>
            <ol>
                <li><strong>在搜索框内输入产品名称</strong> - 支持模糊搜索，输入部分关键词即可</li>
                <li><strong>从列表中选择对应的产品安装教程</strong> - 点击产品名称可以查看详细信息</li>
                <li><strong>点击播放视频按钮</strong> - 即可观看详细的安装视频教程</li>
            </ol>
        </div>
        
        <div id="videoList" class="video-list">
            <!-- 视频列表会在这里显示 -->
        </div>
    </div>

    <script>
        // 这里是你的硒鼓安装视频数据
        const videoData = [
            // 格式：["产品名称", "B站视频ID"]
            // 示例：
            ["HP 202A 硒鼓安装教程", "BV1xe4y1L7NC"],
            ["Canon 328 硒鼓更换教程", "BV19T4y1g7Xu"],
            ["Brother 2612 硒鼓安装", "BV1HaCGYQE6d"],
            ["Epson 630 硒鼓更换教程", "BV1yq4y1D7gq"],
            ["联想 2612 硒鼓安装", "BV1HaCGYQE6d"],
            ["惠普 202A 硒鼓更换", "BV1nK411M7FD"],
            // 把你Excel里的50行数据按这个格式复制到这里
            // ["硒鼓型号/产品名称", "B站视频BV号"],
            // ...
        ];

        // 更新视频数量显示
        document.addEventListener('DOMContentLoaded', () => {
            const countElement = document.querySelector('.video-count');
            countElement.textContent = `共 ${videoData.length} 个安装教程视频`;
        });

        // 存储当前播放的视频
        let currentPlayingId = null;

        // 显示所有视频
        function displayVideos(videos) {
            const listElement = document.getElementById('videoList');
            
            if (videos.length === 0) {
                listElement.innerHTML = '<div class="no-result">未找到相关视频，请尝试其他关键词</div>';
                return;
            }
            
            let html = '';
            videos.forEach((item, index) => {
                const [productName, videoId] = item;
                const itemId = `video-${index}`;
                html += `
                <div class="video-item" id="${itemId}">
                    <div class="video-header">
                        <div class="video-title">${productName}</div>
                        <button class="play-btn" data-id="${itemId}" data-video="${videoId}">
                            ▶ 播放视频
                        </button>
                    </div>
                    <div class="video-container">
                        <div class="loading">视频加载中，请稍候...</div>
                        <iframe 
                            class="video-player"
                            src="about:blank"
                            scrolling="no" 
                            frameborder="0" 
                            allowfullscreen="true"
                            allow="autoplay; encrypted-media"
                            sandbox="allow-same-origin allow-scripts allow-popups allow-forms"
                            data-bvid="${videoId}">
                        </iframe>
                    </div>
                </div>`;
            });
            listElement.innerHTML = html;
            
            // 添加点击事件
            document.querySelectorAll('.play-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const itemId = this.getAttribute('data-id');
                    const videoId = this.getAttribute('data-video');
                    toggleVideo(itemId, videoId, this);
                });
            });
        }

        // 切换视频播放
        function toggleVideo(itemId, videoId, button) {
            const item = document.getElementById(itemId);
            const container = item.querySelector('.video-container');
            const iframe = item.querySelector('.video-player');
            const loading = container.querySelector('.loading');
            
            // 如果点击的是当前正在播放的视频，则关闭
            if (currentPlayingId === itemId) {
                // 停止播放
                iframe.src = 'about:blank';
                container.classList.remove('active');
                button.innerHTML = '▶ 播放视频';
                button.classList.remove('playing');
                currentPlayingId = null;
                loading.style.display = 'block';
                return;
            }
            
            // 关闭其他正在播放的视频
            if (currentPlayingId) {
                const prevItem = document.getElementById(currentPlayingId);
                if (prevItem) {
                    const prevContainer = prevItem.querySelector('.video-container');
                    const prevIframe = prevItem.querySelector('.video-player');
                    const prevButton = prevItem.querySelector('.play-btn');
                    const prevLoading = prevContainer.querySelector('.loading');
                    
                    prevIframe.src = 'about:blank';
                    prevContainer.classList.remove('active');
                    prevButton.innerHTML = '▶ 播放视频';
                    prevButton.classList.remove('playing');
                    prevLoading.style.display = 'block';
                }
            }
            
            // 播放当前视频
            console.log('正在加载硒鼓安装视频:', videoId);
            
            // 正确的B站嵌入格式
            const embedUrl = `https://player.bilibili.com/player.html?bvid=${videoId}&page=1&high_quality=1&autoplay=1`;
            
            // 设置iframe的src
            iframe.src = embedUrl;
            loading.style.display = 'none';
            
            container.classList.add('active');
            button.innerHTML = '⏸ 关闭视频';
            button.classList.add('playing');
            currentPlayingId = itemId;
            
            // 滚动到视频位置
            setTimeout(() => {
                item.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }, 300);
        }

        // 搜索功能
        function searchVideos() {
            const searchText = document.getElementById('searchInput').value.toLowerCase().trim();
            
            if (!searchText) {
                displayVideos(videoData);
                return;
            }
            
            const filtered = videoData.filter(item => {
                const productName = item[0].toLowerCase();
                return productName.includes(searchText);
            });
            
            // 关闭当前播放的视频
            if (currentPlayingId) {
                const currentItem = document.getElementById(currentPlayingId);
                if (currentItem) {
                    const container = currentItem.querySelector('.video-container');
                    const iframe = currentItem.querySelector('.video-player');
                    const button = currentItem.querySelector('.play-btn');
                    const loading = container.querySelector('.loading');
                    
                    iframe.src = 'about:blank';
                    container.classList.remove('active');
                    button.innerHTML = '▶ 播放视频';
                    button.classList.remove('playing');
                    loading.style.display = 'block';
                }
                currentPlayingId = null;
            }
            
            displayVideos(filtered);
            
            // 显示搜索结果数量
            const countElement = document.querySelector('.video-count');
            countElement.textContent = `找到 ${filtered.length} 个相关教程`;
        }

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            displayVideos(videoData);
            
            // 实时搜索
            const searchInput = document.getElementById('searchInput');
            let searchTimer;
            
            searchInput.addEventListener('input', function() {
                clearTimeout(searchTimer);
                searchTimer = setTimeout(searchVideos, 300);
            });
            
            // 清空搜索框功能
            searchInput.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    this.value = '';
                    searchVideos();
                }
            });
        });
    </script>
</body>
</html>
