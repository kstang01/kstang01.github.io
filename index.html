<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>硒鼓安装教程视频库</title>
    <style>
        /* 全局样式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif;
            background-color: #f7f7f7;
            color: #333;
            line-height: 1.6;
            padding: 0;
            min-height: 100vh;
        }
        
        /* 容器样式 */
        .container {
            max-width: 900px;
            margin: 0 auto;
            background-color: white;
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.05);
            border-radius: 0;
            overflow: hidden;
            min-height: 100vh;
        }
        
        /* 头部样式 */
        .header {
            background: linear-gradient(135deg, #07C160 0%, #06AD56 100%);
            color: white;
            padding: 20px 20px;
            text-align: center;
            position: relative;
        }
        
        .header:after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 0;
            right: 0;
            height: 20px;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 120" fill="%23f7f7f7"><path d="M0,64L80,69.3C160,75,320,85,480,80C640,75,800,53,960,48C1120,43,1280,53,1360,58.7L1440,64L1440,120L1360,120C1280,120,1120,120,960,120C800,120,640,120,480,120C320,120,160,120,80,120L0,120Z"></path></svg>') no-repeat;
            background-size: cover;
        }
        
        .header h1 {
            font-size: 22px;
            font-weight: 500;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .header h1 .icon {
            margin-right: 10px;
            font-size: 24px;
            filter: brightness(0) invert(1); /* 使图标变为白色 */
        }
        
        .header .subtitle {
            font-size: 13px;
            opacity: 0.9;
            font-weight: 400;
        }
        
        /* 主内容区域 */
        .main-content {
            padding: 20px 20px 30px;
        }
        
        /* 搜索区域 */
        .search-section {
            margin-bottom: 15px;
        }
        
        .search-box {
            position: relative;
            width: 100%;
        }
        
        .search-box input {
            width: 100%;
            padding: 14px 45px 14px 16px;
            font-size: 15px;
            border: 1px solid #e6e6e6;
            border-radius: 8px;
            background-color: #fafafa;
            transition: all 0.3s;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
        }
        
        .search-box input:focus {
            outline: none;
            border-color: #07C160;
            background-color: white;
            box-shadow: 0 3px 12px rgba(7, 193, 96, 0.1);
        }
        
        .search-box .search-icon {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #07C160;
            font-size: 18px;
        }
        
        /* 使用说明 - 优化后更紧凑 */
        .instructions {
            background-color: #f0f9f4;
            border-radius: 8px;
            padding: 12px 15px;
            margin-bottom: 15px;
            border-left: 3px solid #07C160;
            box-shadow: 0 2px 6px rgba(7, 193, 96, 0.05);
            font-size: 13px;
        }
        
        .instructions h3 {
            color: #07C160;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
        }
        
        .instructions h3 .icon {
            margin-right: 6px;
            font-size: 16px;
        }
        
        .instructions ol {
            padding-left: 18px;
            margin: 0;
        }
        
        .instructions li {
            margin-bottom: 5px;
            color: #555;
            font-size: 13px;
            line-height: 1.4;
        }
        
        .instructions li:last-child {
            margin-bottom: 0;
        }
        
        .instructions li strong {
            color: #333;
            font-weight: 500;
        }
        
        /* 视频列表标题 */
        .video-list-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        
        .video-list-title h2 {
            font-size: 16px;
            font-weight: 500;
            color: #333;
        }
        
        .video-count {
            background-color: #07C160;
            color: white;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }
        
        /* 视频列表 */
        .video-list {
            display: grid;
            gap: 12px;
        }
        
        .video-item {
            background-color: white;
            border-radius: 8px;
            padding: 15px;
            border: 1px solid #f0f0f0;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.03);
            transition: all 0.3s;
        }
        
        .video-item:hover {
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
            transform: translateY(-1px);
        }
        
        .video-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
        }
        
        .video-title {
            font-weight: 500;
            color: #333;
            font-size: 15px;
            flex: 1;
            line-height: 1.4;
        }
        
        .play-btn {
            background-color: #07C160;
            color: white;
            border: none;
            padding: 7px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.3s;
            white-space: nowrap;
            margin-left: 12px;
            box-shadow: 0 2px 5px rgba(7, 193, 96, 0.2);
            display: flex;
            align-items: center;
        }
        
        .play-btn:hover {
            background-color: #06AD56;
            transform: translateY(-1px);
            box-shadow: 0 3px 8px rgba(7, 193, 96, 0.3);
        }
        
        .play-btn.playing {
            background-color: #f85e5e;
            box-shadow: 0 2px 5px rgba(248, 94, 94, 0.2);
        }
        
        .play-btn.playing:hover {
            background-color: #e75353;
            box-shadow: 0 3px 8px rgba(248, 94, 94, 0.3);
        }
        
        .play-btn .btn-icon {
            margin-right: 4px;
            font-size: 14px;
        }
        
        .video-container {
            width: 100%;
            height: 0;
            overflow: hidden;
            transition: height 0.3s ease;
            border-radius: 6px;
            margin-top: 12px;
            background-color: #000;
        }
        
        .video-container.active {
            height: 280px;
        }
        
        .video-player {
            width: 100%;
            height: 280px;
            border-radius: 6px;
            border: none;
            display: block;
        }
        
        .no-result {
            text-align: center;
            padding: 40px 15px;
            color: #999;
        }
        
        .no-result-icon {
            font-size: 40px;
            margin-bottom: 12px;
            opacity: 0.5;
        }
        
        .no-result p {
            font-size: 15px;
        }
        
        .no-result .hint {
            font-size: 13px;
            margin-top: 8px;
            color: #666;
        }
        
        /* 页脚 */
        .footer {
            text-align: center;
            padding: 20px 15px;
            color: #999;
            font-size: 12px;
            border-top: 1px solid #f0f0f0;
            background-color: #fafafa;
        }
        
        .footer .wechat-icon {
            color: #07C160;
            font-size: 16px;
            margin-right: 4px;
            vertical-align: middle;
        }
        
        /* 响应式设计 */
        @media (max-width: 768px) {
            .container {
                border-radius: 0;
                box-shadow: none;
            }
            
            .header {
                padding: 18px 15px;
            }
            
            .header h1 {
                font-size: 20px;
            }
            
            .main-content {
                padding: 15px 15px 25px;
            }
            
            .video-header {
                flex-direction: column;
                align-items: flex-start;
            }
            
            .video-title {
                margin-bottom: 10px;
                font-size: 14px;
            }
            
            .play-btn {
                margin-left: 0;
                align-self: flex-start;
                padding: 6px 12px;
                font-size: 12px;
            }
            
            .video-container.active {
                height: 200px;
            }
            
            .video-player {
                height: 200px;
            }
            
            .search-box input {
                padding: 12px 40px 12px 14px;
                font-size: 14px;
            }
            
            .instructions {
                padding: 10px 12px;
                margin-bottom: 12px;
            }
            
            .instructions li {
                font-size: 12px;
            }
        }
        
        /* 加载动画 */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
            color: #07C160;
            font-size: 13px;
        }
        
        .loading:before {
            content: '';
            width: 16px;
            height: 16px;
            border: 2px solid rgba(7, 193, 96, 0.2);
            border-top-color: #07C160;
            border-radius: 50%;
            margin-right: 8px;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        
        /* 搜索结果提示 */
        .search-result-info {
            color: #07C160;
            font-size: 13px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
        }
        
        .search-result-info .icon {
            margin-right: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><span class="icon">🖥️</span>硒鼓安装教程视频库</h1>
            <div class="subtitle">专业硒鼓安装教学，快速掌握更换技巧</div>
        </div>
        
        <div class="main-content">
            <div class="search-section">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="请输入硒鼓型号或产品名称进行搜索...">
                    <div class="search-icon">🔍</div>
                </div>
            </div>
            
            <div class="instructions">
                <h3><span class="icon">📚</span>使用说明：</h3>
                <ol>
                    <li><strong>在搜索框内输入产品名称</strong> - 支持模糊搜索</li>
                    <li><strong>从列表中选择对应的产品安装教程</strong></li>
                    <li><strong>点击播放视频按钮</strong> - 观看详细安装视频教程</li>
                </ol>
            </div>
            
            <div class="video-list-title">
                <h2>安装教程列表</h2>
                <div class="video-count" id="videoCount">50 个教程</div>
            </div>
            
            <div id="searchResultInfo" class="search-result-info" style="display: none;">
                <span class="icon">🔍</span> <span id="resultText"></span>
            </div>
            
            <div id="videoList" class="video-list">
                <!-- 视频列表会在这里动态生成 -->
            </div>
        </div>
        
        <div class="footer">
            <div><span class="wechat-icon">💚</span>扫码观看 | 硒鼓安装教程视频</div>
            <div style="margin-top: 6px; font-size: 11px; opacity: 0.8;">© 2026 蚁社电商 版权所有</div>
        </div>
    </div>

    <script>
        // 硒鼓安装视频数据
        const videoData = [
            ["137XX 1460 万页版安装视频", "BV13kzZB7EHt"],
            ["450XX大容量粉盒安装", "BV1tMzZB6EEM"],
            ["1020 2612硒鼓安装小硒鼓教程", "BV1tMzZB6E7w"],
            ["1035/TN1000/1035/201/115T粉盒鼓架安装教程", "BV1nWzZB8EJg"],
            ["1110 166 1003 110 1680万页版安装视频", "BV1WjzZBNEZH"],
            ["1520 277 万页版安装视频", "BV1CjzZBNE2n"],
            ["1520 277 万页 安装教程", "BV1WjzZBNECG"],
            ["2325XX粉盒大容量安装教程", "BV1yjzZBNEAP"],
            ["奔图 213 219 206 202 205 201奔图2系列小容量安装教程", "BV1WjzZBNEoS"],
            ["惠普 137 1370硒鼓安装教程", "BV1WjzZBNEdj"],
            ["惠普 277 429 329硒鼓安装教程", "BV1yjzZBNEwy"],
            ["惠普 388 硒鼓安装教程", "BV1WjzZBNE2D"],
            ["惠普 万页版 2612 388 硒鼓安装教程", "BV1WjzZBNEVn"],
            ["惠普217 218 230XX万页版安装", "BV1s5zZBiE4R"],
            ["惠普500 510 206 416一体式彩鼓安装教程", "BV1N5zZBqEwq"],
            ["惠普1110 166 1003 1680 小米K100 三星111 101安装教程", "BV1y5zZBiEen"],
            ["惠普CF 230 217 218 CF 219 232粉盒鼓架安装视频", "BV1s5zZBiEjZ"],
            ["惠普CF 230 217 218粉盒安装教程", "BV1s5zZBiE6q"],
            ["联想101w、7268、2268、100分离式硒鼓粉盒安装", "BV1s5zZBiE6Y"],
            ["兄弟2240 450套装 粉盒硒鼓安装教程", "BV1y5zZBiE9Q"],
        ];

        // 存储当前播放的视频
        let currentPlayingId = null;
        
        // 更新视频数量显示
        function updateVideoCount(count) {
            const countElement = document.getElementById('videoCount');
            countElement.textContent = `${count} 个教程`;
        }
        
        // 显示搜索结果信息
        function showSearchResultInfo(filteredCount, totalCount) {
            const resultInfo = document.getElementById('searchResultInfo');
            const resultText = document.getElementById('resultText');
            
            if (filteredCount === totalCount) {
                resultInfo.style.display = 'none';
            } else {
                resultInfo.style.display = 'flex';
                resultText.textContent = `找到 ${filteredCount} 个相关结果（共 ${totalCount} 个教程）`;
            }
        }

        // 显示所有视频
        function displayVideos(videos) {
            const listElement = document.getElementById('videoList');
            
            if (videos.length === 0) {
                listElement.innerHTML = `
                    <div class="no-result">
                        <div class="no-result-icon">🔍</div>
                        <p>未找到相关视频</p>
                        <div class="hint">请尝试使用其他关键词，如"HP"、"Canon"、"Brother"等</div>
                    </div>
                `;
                return;
            }
            
            let html = '';
            videos.forEach((item, index) => {
                const [productName, videoId] = item;
                const itemId = `video-${index}`;
                html += `
                <div class="video-item" id="${itemId}">
                    <div class="video-header">
                        <div class="video-title">${productName}</div>
                        <button class="play-btn" data-id="${itemId}" data-video="${videoId}">
                            <span class="btn-icon">▶</span>播放视频
                        </button>
                    </div>
                    <div class="video-container">
                        <div class="loading">视频加载中...</div>
                        <iframe 
                            class="video-player"
                            src="about:blank"
                            scrolling="no" 
                            frameborder="0" 
                            allowfullscreen="true"
                            allow="autoplay; encrypted-media"
                            sandbox="allow-same-origin allow-scripts allow-popups allow-forms"
                            data-bvid="${videoId}">
                        </iframe>
                    </div>
                </div>`;
            });
            listElement.innerHTML = html;
            
            // 更新视频数量
            updateVideoCount(videos.length);
            showSearchResultInfo(videos.length, videoData.length);
            
            // 添加点击事件
            document.querySelectorAll('.play-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const itemId = this.getAttribute('data-id');
                    const videoId = this.getAttribute('data-video');
                    toggleVideo(itemId, videoId, this);
                });
            });
        }

        // 切换视频播放
        function toggleVideo(itemId, videoId, button) {
            const item = document.getElementById(itemId);
            const container = item.querySelector('.video-container');
            const iframe = item.querySelector('.video-player');
            const loading = container.querySelector('.loading');
            
            // 如果点击的是当前正在播放的视频，则关闭
            if (currentPlayingId === itemId) {
                // 停止播放
                iframe.src = 'about:blank';
                container.classList.remove('active');
                button.innerHTML = '<span class="btn-icon">▶</span>播放视频';
                button.classList.remove('playing');
                currentPlayingId = null;
                loading.style.display = 'flex';
                return;
            }
            
            // 关闭其他正在播放的视频
            if (currentPlayingId) {
                const prevItem = document.getElementById(currentPlayingId);
                if (prevItem) {
                    const prevContainer = prevItem.querySelector('.video-container');
                    const prevIframe = prevItem.querySelector('.video-player');
                    const prevButton = prevItem.querySelector('.play-btn');
                    const prevLoading = prevContainer.querySelector('.loading');
                    
                    prevIframe.src = 'about:blank';
                    prevContainer.classList.remove('active');
                    prevButton.innerHTML = '<span class="btn-icon">▶</span>播放视频';
                    prevButton.classList.remove('playing');
                    prevLoading.style.display = 'flex';
                }
            }
            
            // 播放当前视频
            console.log('正在加载视频:', videoId);
            
            // 正确的B站嵌入格式
            const embedUrl = `https://player.bilibili.com/player.html?bvid=${videoId}&page=1&high_quality=1&autoplay=1`;
            
            // 设置iframe的src
            iframe.src = embedUrl;
            loading.style.display = 'none';
            
            container.classList.add('active');
            button.innerHTML = '<span class="btn-icon">⏸</span>关闭视频';
            button.classList.add('playing');
            currentPlayingId = itemId;
            
            // 滚动到视频位置
            setTimeout(() => {
                item.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }, 300);
        }

        // 搜索功能
        function searchVideos() {
            const searchText = document.getElementById('searchInput').value.toLowerCase().trim();
            
            if (!searchText) {
                displayVideos(videoData);
                return;
            }
            
            const filtered = videoData.filter(item => {
                const productName = item[0].toLowerCase();
                return productName.includes(searchText);
            });
            
            // 关闭当前播放的视频
            if (currentPlayingId) {
                const currentItem = document.getElementById(currentPlayingId);
                if (currentItem) {
                    const container = currentItem.querySelector('.video-container');
                    const iframe = currentItem.querySelector('.video-player');
                    const button = currentItem.querySelector('.play-btn');
                    const loading = container.querySelector('.loading');
                    
                    iframe.src = 'about:blank';
                    container.classList.remove('active');
                    button.innerHTML = '<span class="btn-icon">▶</span>播放视频';
                    button.classList.remove('playing');
                    loading.style.display = 'flex';
                }
                currentPlayingId = null;
            }
            
            displayVideos(filtered);
        }

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            // 显示所有视频
            displayVideos(videoData);
            
            // 搜索框实时搜索
            const searchInput = document.getElementById('searchInput');
            let searchTimer;
            
            searchInput.addEventListener('input', function() {
                clearTimeout(searchTimer);
                searchTimer = setTimeout(searchVideos, 300);
            });
            
            // 按回车键搜索
            searchInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    searchVideos();
                }
            });
            
            // 按ESC键清空搜索框
            searchInput.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    this.value = '';
                    searchVideos();
                }
            });
        });
    </script>
</body>
</html>
